<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#101619" />
  <title>INDRA — Open Road</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c9e363'/%3E%3Cpath d='M28 12h8v40h-8z' fill='%23101619'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <main id="game-shell">
    <canvas id="scene" aria-label="INDRA open road driving game"></canvas>
    <div class="vignette"></div>
    <header class="topbar">
      <a class="brand" href="#" aria-label="Indra home"><span class="brand-mark">I</span><span>INDRA<small>OPEN ROAD</small></span></a>
      <div class="top-meta"><span class="live-dot"></span><span id="regionLabel">MUMBAI · WESTERN EXPRESS</span><span class="meta-divider"></span><span id="clockLabel">08:42</span><span class="weather-icon" id="weatherIcon">☀</span></div>
      <button class="icon-button" id="pauseBtn" aria-label="Pause game">Ⅱ</button>
    </header>
    <section class="mission-card glass">
      <div class="eyebrow"><span class="live-dot"></span> CURRENT DRIVE</div>
      <div class="mission-title" id="missionTitle">THE CITY IS YOURS</div>
      <div class="mission-sub" id="missionSub">Free drive · no limits</div>
      <div class="mission-progress"><span id="distanceFill"></span></div>
      <div class="mission-foot"><span id="distanceLabel">0.0 KM</span><span id="missionGoal">EXPLORE AT YOUR PACE</span></div>
    </section>
    <aside class="right-rail">
      <div class="glass mini-map" aria-label="Road map"><div class="map-grid"></div><svg viewBox="0 0 120 120" aria-hidden="true"><path d="M22 105 C38 84 47 82 48 59 C49 40 77 44 78 27 C79 17 89 12 99 10"/><circle cx="48" cy="59" r="4"/><path class="map-player" d="M53 68l-5-12-5 12 5-2z"/></svg><span class="map-label">YOU</span></div>
      <button class="rail-button glass" id="garageBtn"><span>▣</span><small>GARAGE</small></button>
      <button class="rail-button glass" id="weatherBtn"><span>◉</span><small>WEATHER</small></button>
      <button class="rail-button glass" id="lightsBtn"><span>☼</span><small>LIGHTS</small><i class="status-led" id="lightLed"></i></button>
    </aside>
    <div class="road-sign glass" id="roadSign"><span class="sign-icon">↗</span><div><b>NH 48</b><small>KEEP LEFT · DRIVE SAFE</small></div></div>
    <div class="speed-hud glass">
      <div class="speed-main"><span class="speed-value" id="speedValue">000</span><span class="speed-unit">KM/H</span></div>
      <div class="speed-rule"><span id="rpmFill"></span></div>
      <div class="speed-bottom"><span id="gearLabel">D</span><span class="rpm-label">RPM <b id="rpmValue">0.8</b></span><span class="fuel-label">FUEL <b id="fuelValue">92%</b></span></div>
    </div>
    <div class="status-stack"><div><span class="status-icon">◇</span><span id="conditionLabel">VEHICLE CONDITION</span><b id="conditionValue">100%</b></div><div class="condition-track"><i id="conditionFill"></i></div></div>
    <div class="controls-hint" id="controlsHint"><span class="keycap">W</span><span class="keycap">A</span><span class="keycap">S</span><span class="keycap">D</span><span class="hint-copy">DRIVE</span><span class="hint-sep"></span><span class="keycap">C</span><span class="hint-copy">CAMERA</span><span class="hint-sep"></span><span class="keycap">H</span><span class="hint-copy">HORN</span></div>
    <div class="view-chip" id="cameraLabel">CHASE CAM <span>·</span> 01</div>
    <div id="mobileControls" class="mobile-controls"><button data-control="left">◀</button><button data-control="brake">▼</button><button data-control="right">▶</button><button data-control="gas">▲</button></div>
    <div class="action-buttons"><button class="action-button" id="indicatorBtn"><span>↔</span><small>INDICATOR</small></button><button class="action-button" id="hornBtn"><span>⌁</span><small>HORN</small></button><button class="action-button" id="cameraBtn"><span>◉</span><small>CAMERA</small></button></div>
    <div class="modal-backdrop hidden" id="modalBackdrop"><section class="modal glass" id="modal" role="dialog" aria-modal="true"></section></div>
    <div class="toast" id="toast"></div>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
